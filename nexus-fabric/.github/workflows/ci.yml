# .github/workflows/ci.yml
# Nexus-Fabric CI/CD Pipeline
# Triggers: Push/PR to main → test → build → deploy (on main only)

name: Nexus-Fabric CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"
  ACR_NAME: ${{ secrets.ACR_NAME }}
  RESOURCE_GROUP: nexus-fabric-rg
  CONTAINER_APP_NAME: nexus-fabric

jobs:
  # ────────────────────────────────────────────
  # JOB 1: Lint + Unit Tests
  # ────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check . --select E,W,F --ignore E501

      - name: Unit tests (chunking logic)
        env:
          DEMO_MODE: "true"   # Tests run in demo mode — no Azure needed
        run: |
          pytest ../tests/ -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ────────────────────────────────────────────
  # JOB 2: Test PySpark Notebooks (unit tests only — no cluster needed)
  # ────────────────────────────────────────────
  test-notebooks:
    name: Test Notebooks (PySpark)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install PySpark test deps
        run: |
          pip install pyspark==3.5.0 pytest pytest-mock

      - name: Run notebook unit tests
        run: |
          pytest tests/test_chunking.py -v --tb=short

  # ────────────────────────────────────────────
  # JOB 3: Build Docker image (main branch only)
  # ────────────────────────────────────────────
  build:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: [test, test-notebooks]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push
        run: |
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/nexus-fabric:${{ github.sha }}"
          LATEST="${{ env.ACR_NAME }}.azurecr.io/nexus-fabric:latest"
          docker build -t $IMAGE -t $LATEST ./app
          docker push $IMAGE
          docker push $LATEST
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

  # ────────────────────────────────────────────
  # JOB 4: Deploy to Azure Container Apps
  # ────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/nexus-fabric:${{ github.sha }}

      - name: Get app URL
        run: |
          URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "✅ Deployed to: https://$URL"
          echo "APP_URL=https://$URL" >> $GITHUB_ENV

      - name: Smoke test
        run: |
          sleep 15  # wait for container to start
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $APP_URL/healthz)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Health check failed: $HTTP_CODE"
            exit 1
          fi
          echo "✅ Health check passed"
